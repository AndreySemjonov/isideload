name: Watch RSD validation
on:
  workflow_dispatch:
  push:
    branches: ['ci/watch-rsd-validation']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev
      - run: cargo check -p isideload
      - run: cargo test --locked -p isideload --lib

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resolved-cargo-lock
          path: Cargo.lock
